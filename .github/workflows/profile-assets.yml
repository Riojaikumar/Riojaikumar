name: Build profile assets

# Generates every dynamic asset the README references and publishes them all to
# the `output` branch in ONE commit. Kept as a single job on purpose: two
# workflows publishing to the same branch would clobber each other's files.

on:
  schedule:
    - cron: "0 3 * * *"      # daily, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'          # avoid a rebuild loop on README-only edits

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stats + language cards
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-stats.mjs

      - name: Contribution snake (dark + light)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Verify every expected asset exists before publishing
        run: |
          set -euo pipefail
          missing=0
          for f in dist/snake-dark.svg dist/snake-light.svg dist/stats.svg dist/langs.svg; do
            if [ ! -s "$f" ]; then echo "MISSING or empty: $f"; missing=1; else
              printf '  ok %-24s %s bytes\n' "$f" "$(stat -c%s "$f")"; fi
          done
          [ "$missing" -eq 0 ] || { echo "refusing to publish a partial asset set"; exit 1; }

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Language mix across public repositories">
  <defs>
    <linearGradient id="l-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/><stop offset="100%" stop-color="#11162c"/>
    </linearGradient>
    <linearGradient id="l-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="l-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#7dd3fc" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="l-clip"><rect width="400" height="250" rx="14"/></clipPath>
    <style>.l-t{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}</style>
  </defs>
  <g clip-path="url(#l-clip)">
    <rect width="400" height="250" fill="url(#l-bg)"/>
    <rect width="400" height="250" fill="url(#l-grid)"/>
    <text class="l-t" x="24" y="30" font-size="10.5" fill="#64748b" letter-spacing="2.4">LANGUAGE MIX</text>
    <text class="l-t" x="376" y="30" font-size="9.5" text-anchor="end" fill="#475569" letter-spacing="1.2">PUBLIC REPOS</text>
    <rect x="24" y="40" width="352" height="1.4" rx="1" fill="url(#l-rule)">
      <animate attributeName="opacity" values=".45;1;.45" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="108" cy="150" r="50" fill="none" stroke="#1e293b" stroke-width="20"/>
    <circle cx="108" cy="150" r="50" fill="none" stroke="#e34c26" stroke-width="20"
            transform="rotate(-90 108 150)" stroke-dasharray="220.9 314.2" stroke-dashoffset="0">
      <animate attributeName="stroke-dasharray" from="0 314.2" to="220.9 314.2" dur="1.1s" begin="0.00s" fill="freeze"/>
    </circle>
    <circle cx="108" cy="150" r="50" fill="none" stroke="#f1e05a" stroke-width="20"
            transform="rotate(-90 108 150)" stroke-dasharray="93.3 314.2" stroke-dashoffset="-220.9">
      <animate attributeName="stroke-dasharray" from="0 314.2" to="93.3 314.2" dur="1.1s" begin="0.18s" fill="freeze"/>
    </circle>
    <text class="l-t" x="108" y="148" text-anchor="middle" font-size="22" font-weight="800" fill="#e2e8f0">2</text>
    <text class="l-t" x="108" y="165" text-anchor="middle" font-size="8.5" fill="#64748b" letter-spacing="1.4">LANGUAGES</text>
    <text class="l-t" x="108" y="230" text-anchor="middle" font-size="10" fill="#94a3b8">10 public repos</text>
    <text class="l-t" x="200" y="82" font-size="9.5" fill="#64748b" letter-spacing="1.4">BY BYTES</text>
    <g>
      <rect x="200" y="98" width="11" height="11" rx="3" fill="#e34c26"/>
      <text class="l-t" x="220" y="108" font-size="12.5" fill="#cbd5e1">HTML</text>
      <text class="l-t" x="376" y="108" font-size="12.5" text-anchor="end" fill="#94a3b8">70.3%</text>
    </g>
    <g>
      <rect x="200" y="128" width="11" height="11" rx="3" fill="#f1e05a"/>
      <text class="l-t" x="220" y="138" font-size="12.5" fill="#cbd5e1">JavaScript</text>
      <text class="l-t" x="376" y="138" font-size="12.5" text-anchor="end" fill="#94a3b8">29.7%</text>
    </g>
    <rect width="400" height="250" rx="14" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-width="1.5"/>
  </g>
</svg>

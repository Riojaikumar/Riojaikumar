<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" role="presentation">
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="70%" stop-color="#34d399" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1000" height="2" rx="1" fill="url(#dv)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cy="4" r="2.5" fill="#e0f2fe">
    <animate attributeName="cx" values="120;880;120" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Jaikumar — Full Stack Developer, Burdenoff Consultancy Services">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0d1b33"/>
      <stop offset="100%" stop-color="#120b24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"><animate attributeName="stop-color" values="#7dd3fc;#a78bfa;#34d399;#7dd3fc" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#34d399;#7dd3fc;#a78bfa" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#34d399"><animate attributeName="stop-color" values="#34d399;#7dd3fc;#a78bfa;#34d399" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".5"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".42"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:"Segoe UI",Inter,Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .twinkle{animation:tw 3.4s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      @media (prefers-reduced-motion: reduce){ .twinkle{animation:none;opacity:.6} }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#sky)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <ellipse cx="180" cy="70" rx="260" ry="180" fill="url(#orbA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 34; -30 18; 0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="830" cy="215" rx="300" ry="190" fill="url(#orbB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 -28; 34 -12; 0 0" dur="21s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="520" cy="30" rx="230" ry="140" fill="url(#orbC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 26 44; -44 12; 0 0" dur="25s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="#e0f2fe">
      <circle class="twinkle" cx="120" cy="210" r="1.6"/>
      <circle class="twinkle" cx="300" cy="52" r="1.3" style="animation-delay:.5s"/>
      <circle class="twinkle" cx="690" cy="86" r="1.7" style="animation-delay:1.1s"/>
      <circle class="twinkle" cx="905" cy="150" r="1.4" style="animation-delay:1.7s"/>
      <circle class="twinkle" cx="430" cy="238" r="1.5" style="animation-delay:2.3s"/>
      <circle class="twinkle" cx="780" cy="44" r="1.2" style="animation-delay:2.9s"/>
    </g>

    <text class="mono" x="500" y="74" text-anchor="middle" font-size="15" fill="#7dd3fc" letter-spacing="5">
      <tspan opacity=".85">$</tspan><tspan opacity=".95"> whoami</tspan>
    </text>

    <text class="sans" x="500" y="146" text-anchor="middle" font-size="60" font-weight="800" fill="url(#name)" letter-spacing="-1">Jaikumar</text>

    <g class="mono" font-size="19" text-anchor="middle">
      <text x="500" y="192" fill="#a5b4fc" opacity="1">Full Stack Developer<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
      <text x="500" y="192" fill="#6ee7b7" opacity="0">Microservices &amp; GraphQL Federation<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
      <text x="500" y="192" fill="#fca5a5" opacity="0">Cloud Infrastructure &amp; Platform Engineering<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
      <text x="500" y="192" fill="#fcd34d" opacity="0">Microfrontends at Scale<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
    </g>

    <rect x="250" y="222" width="500" height="2" rx="1" fill="url(#rule)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <text class="mono" x="500" y="252" text-anchor="middle" font-size="12.5" fill="#64748b" letter-spacing="2.5">
      BURDENOFF CONSULTANCY SERVICES &#183; TAMIL NADU, INDIA
    </text>

    <rect width="1000" height="280" rx="18" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-width="1.5"/>
  </g>
</svg>
